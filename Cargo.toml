[package]
name = "next-next-next"
version = "0.1.0"
edition = "2024"

# Iterators tend to get very slow without optimizations
# so we enable optimizations even for debug builds
[profile.dev]
opt-level = 2

[dependencies]
csv = "1.4.0"
flate2 = "1.1.9"
jiff = { version = "0.2.32", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
