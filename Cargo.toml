# Don't edit the `bin` list manually! It is updated by `rustlings dev update`
bin = [
  { name = "loops1", path = "exercises/00_loops/loops1.rs" },
  { name = "loops2", path = "exercises/00_loops/loops2.rs" },
  { name = "loops3", path = "exercises/00_loops/loops3.rs" },
  { name = "loops4", path = "exercises/00_loops/loops4.rs" },
  { name = "enumerate1", path = "exercises/01_enumerate/enumerate1.rs" },
  { name = "enumerate2", path = "exercises/01_enumerate/enumerate2.rs" },
]

[package]
name = "next-next-next"
edition = "2024"
# Don't publish the exercises on crates.io!
publish = false

# Iterators tend to get very slow without optimizations
# so we enable optimizations even for debug builds
[profile.dev]
opt-level = 2

[dependencies]
csv = "1.4.0"
flate2 = {version = "1.1.9", features = ["zlib-rs"], default-features = false }
jiff = { version = "0.2.32", features = ["serde"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }

[lints.rust]
# You shouldn't write unsafe code in Rustlings!
unsafe_code = "forbid"
# You don't need unstable features in Rustlings and shouldn't rely on them while learning Rust.
unstable_features = "forbid"
# Dead code warnings can't be avoided in some exercises and might distract while learning.
dead_code = "allow"

[lints.clippy]
# You forgot a `todo!()`!
todo = "forbid"
# This can only happen by mistake in Rustlings.
empty_loop = "forbid"
# No infinite loops are needed in Rustlings.
infinite_loop = "deny"
# You shouldn't leak memory while still learning Rust!
mem_forget = "deny"
# Currently, there are no disallowed methods. This line avoids problems when developing Rustlings.
disallowed_methods = "allow"
